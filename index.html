<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أ. عبدالعزيز الفيفي - النسخة المعتمدة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { --royal-blue: #1e3a8a; --q-red: #ef4444; --bg-page: #f8fafc; --success-green: #10b981; --k-purple: #7c3aed; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, Arial; 
            background: var(--bg-page); margin: 0; padding: 20px; 
            display: flex; flex-direction: column; align-items: center; line-height: 1.6;
        }

        .user-header {
            width: 100%; max-width: 850px; background: white; border-radius: 15px; padding: 20px;
            display: flex; justify-content: space-between; align-items: center; text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-bottom: 5px solid #3b82f6; 
            margin-bottom: 20px; box-sizing: border-box; gap: 15px; flex-wrap: wrap;
        }
        .header-right { flex: 1; text-align: right; min-width: 140px; }
        .header-center { flex: 0 0 auto; display: flex; justify-content: center; }
        .header-left { flex: 1; text-align: left; min-width: 140px; }

        .user-name { margin: 0; color: var(--royal-blue); font-weight: bold; font-size: 1.3rem; }
        .school-name { margin: 0; color: #64748b; font-weight: bold; font-size: 0.95rem; }
        .logo-box { background: var(--royal-blue); width: 55px; height: 55px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.4rem; }

        .array-import-box {
            width: 100%; max-width: 850px; background: white; border-radius: 15px; padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 2px dashed #0284c7; margin-bottom: 25px; box-sizing: border-box;
        }
        .array-textarea {
            width: 100%; height: 120px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px;
            font-family: monospace; font-size: 0.9rem; direction: ltr; text-align: left; outline: none; box-sizing: border-box; resize: vertical; margin-bottom: 10px;
        }

        .auth-card {
            background: white; width: 100%; max-width: 850px; border-radius: 20px; padding: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; box-sizing: border-box; margin-bottom: 25px;
        }
        .auth-input { width: 80%; max-width: 400px; padding: 15px; border-radius: 10px; border: 2px solid #cbd5e1; margin-bottom: 15px; text-align: center; font-size: 1.1rem; outline: none; }

        .container { width: 100%; max-width: 850px; padding-bottom: 120px; display: none; }
        .question-card { background: white; border-radius: 20px; padding: 25px; margin-bottom: 25px; border: 2px solid #e2e8f0; position: relative; text-align: right; box-sizing: border-box; transition: 0.3s; }
        .question-card::before { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 8px; background: var(--k-purple); }
        
        .question-card.unanswered-alert { border: 2px solid var(--q-red) !important; background-color: #fff5f5; }
        .question-card.unanswered-alert .q-number-badge { background-color: var(--q-red) !important; }

        .card-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .q-number-badge { background: var(--k-purple); color: white; padding: 2px 15px; border-radius: 50px; font-weight: bold; font-size: 0.9rem; transition: 0.3s; }
        .type-select { background: #f1f5f9; border: none; padding: 8px; border-radius: 10px; font-weight: bold; font-family: inherit; cursor: pointer; }

        .estieab-box { background: #fff9c4 !important; border: 2px solid #fbc02d; border-radius: 12px; padding: 15px; margin-bottom: 15px; color: #000; font-weight: bold; line-height: 1.8; width: 100%; box-sizing: border-box; text-align: right; min-height: 100px; height: auto; white-space: pre-wrap; font-size: 1.1rem; }
        .q-text-input { width: 100%; padding: 12px 15px; border: 2px solid #e2e8f0; border-radius: 12px; color: var(--q-red) !important; font-weight: bold; font-size: 1.2rem; margin-bottom: 15px; outline: none; text-align: right; box-sizing: border-box; min-height: 50px; height: auto; word-wrap: break-word; font-family: inherit; background: transparent; }

        .essay-input { width: 100%; min-height: 60px; padding: 12px; border: 2px inset #e2e8f0; border-radius: 12px; background: #f8fafc; font-weight: bold; color: #1e293b; margin-top: 10px; outline: none; text-align: right; }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .opt-pair-row { display: flex; align-items: center; background: white; border: 1.5px solid #d1d5db; border-radius: 10px; padding: 12px; box-sizing: border-box; cursor: pointer; transition: 0.2s; }
        .opt-label { font-weight: bold; color: var(--royal-blue); margin-left: 5px; white-space: pre; font-size: 1.05rem; }
        .opt-word { width: 100%; border: none; outline: none; font-weight: bold; color: #000; background: transparent; text-align: right; font-family: inherit; cursor: inherit; font-size: 1.1rem; }

        .correct-ans-box { margin-top: 15px; padding: 10px; background: #f0fdf4; border-radius: 10px; border: 1px solid #bbf7d0; text-align: right; }
        .correct-input { width: 100%; background: transparent; border: none; outline: none; color: #166534; font-weight: bold; text-align: right; font-family: inherit; }

        .controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; flex-wrap: nowrap; gap: 8px; z-index: 1000; background: #1e293b; padding: 10px 15px; border-radius: 50px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); align-items: center; width: max-content; overflow-x: auto; max-width: 95vw; }
        .btn { border: none; padding: 10px 18px; border-radius: 30px; font-weight: bold; cursor: pointer; color: white; display: flex; align-items: center; gap: 8px; transition: 0.3s; font-family: inherit; font-size: 0.9rem; white-space: nowrap; }
        .btn-add { background: #3b82f6; } .btn-save { background: #a855f7; } .btn-load { background: #4f46e5; }
        .btn-link { background: #06b6d4; } .btn-del { background: #f97316; } .btn-pdf { background: #ef4444; }
        .btn-img { background: #10b981; } .btn-clear { background: #64748b; padding: 10px; border-radius: 50%; }

        body.student-mode .controls, body.student-mode .array-import-box, body.student-mode .remove-btn, body.student-mode .type-select, body.student-mode .correct-ans-box, body.student-mode .admin-only { display: none !important; }
        body.student-mode .selected-opt { background: #dbeafe !important; border: 2px solid #3b82f6 !important; }

        #report-modal, #analysis-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 95%; max-width: 850px; height: 85%; background: white; z-index: 2000; border-radius: 20px; padding: 30px; overflow-y: auto; box-shadow: 0 0 50px rgba(0,0,0,0.4); }
        .report-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .report-table th, .report-table td { padding: 12px; border: 1px solid #e2e8f0; text-align: center; }
        .score-edit { width: 45px; text-align: center; border: 1px solid #ccc; font-weight: bold; border-radius: 5px; }
    </style>
</head>
<body>

    <div id="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1999;" onclick="closeModals()"></div>
    
    <div id="report-modal">
        <h2 style="text-align: center; color: var(--royal-blue);">تقرير أداء الطالب 🎯</h2>
        <div id="score-summary" style="text-align: center; font-size: 1.4rem; font-weight: bold; margin: 20px 0;"></div>
        <table class="report-table">
            <thead>
                <tr><th>#</th><th>السؤال</th><th>إجابتك</th><th>الصحيحة</th><th>الدرجة</th></tr>
            </thead>
            <tbody id="report-body"></tbody>
        </table>
        <button class="btn" style="background:#64748b; width:100%; margin-top:20px;" onclick="closeModals()">إغلاق التقرير</button>
    </div>

    <div class="user-header" id="main-header">
        <div class="header-right"><h2 class="user-name">أ. عبدالعزيز الفيفي</h2></div>
        <div class="header-center"><div class="logo-box"><i class="fas fa-award"></i></div></div>
        <div class="header-left"><p class="school-name">ثانوية الأمير عبدالمجيد 😉</p></div>
    </div>

    <!-- شاشة التحقق من إيميل الطالب عبر Firestore -->
    <div id="student-auth-container" style="display:none;">
        <div class="auth-card">
            <h2 style="color: var(--royal-blue); margin-top: 0;">تسجيل دخول الطالب 🎓</h2>
            <p style="color: #64748b; margin-bottom: 20px;">الرجاء إدخال إيميل منصة مدرستي المعتمد لبدء الاختبار:</p>
            <input type="email" id="studentEmailInput" class="auth-input" placeholder="sxxxxxxx@rb.moe.gov.sa">
            <br>
            <button class="btn" style="background: var(--success-green); padding: 12px 30px; font-size: 1.1rem; display:inline-flex; margin:auto;" onclick="verifyStudentEmail()">دخول المنصة 🚀</button>
            <p id="auth-status-msg" style="margin-top: 15px; font-weight: bold;"></p>
        </div>
    </div>

    <div class="array-import-box admin-only">
        <label style="display: block; font-weight: bold; color: #0284c7; margin-bottom: 8px;"><i class="fas fa-file-code"></i> استيراد مصفوفة أسئلة جماعية (الصق هنا مباشرة):</label>
        <textarea id="arrayInputText" class="array-textarea" placeholder="الصق مصفوفة الـ JS هنا (مع أو بدون const rawQuizData = [...])"></textarea>
        <button class="btn" style="background:#0284c7;" onclick="importArrayQuestions()"><i class="fas fa-magic"></i> توليد وتوزيع الأسئلة تلقائياً</button>
    </div>

    <div class="container" id="quiz-content"></div>

    <div id="student-actions" style="display: none; text-align: center; margin-bottom: 50px;">
        <button id="main-grade-btn" class="btn" style="background:#10b981; padding:15px 30px" onclick="gradeExam()"><i class="fas fa-graduation-cap"></i> انتهيت.. اعتماد النتيجة</button>
    </div>

    <div class="controls" id="admin-controls">
        <button class="btn btn-clear" title="مسح الكل" onclick="clearAll()"><i class="fas fa-eraser"></i></button>
        <button class="btn btn-img" onclick="saveAsImages()"><i class="fas fa-image"></i> صور</button>
        <button class="btn btn-pdf" onclick="saveAsPDF()"><i class="fas fa-file-pdf"></i> PDF</button>
        <button class="btn btn-del" onclick="deleteFromCloud()"><i class="fas fa-trash-alt"></i> حذف</button>
        <button class="btn btn-link" onclick="generateStudentLink()"><i class="fas fa-link"></i> رابط الطلاب</button>
        <button class="btn btn-load" style="position:relative;" onclick="loadFromCloud()">
            <i class="fas fa-cloud-download-alt"></i> فتح
            <span class="notif-badge" id="global-notif"></span>
        </button>
        <button class="btn btn-save" onclick="saveToCloud()"><i class="fas fa-cloud-upload-alt"></i> حفظ</button>
        <button class="btn btn-add" onclick="addQuestion()"><i class="fas fa-plus"></i> سؤال</button>
    </div>

    <script>
        let authenticatedStudentEmail = "";
        let authenticatedStudentName = "";
        let loadedExamQuestions = null;

        const typeMap = {
            'k_fill': 'أكمل الفراغ', 'k_irab': 'أعرب ما تحته خط', 'k_sentence': 'مثل في جملة مفيدة',
            'k_extract': 'استخرج من النص', 'k_true': 'صح وخطأ', 'k_multi': 'اختر الإجابة الصحيحة'
        };
        const labels = ['أ) ', 'ب) ', 'ج) ', 'د) '];

        const firebaseConfig = {
            apiKey: "AIzaSyAVrIim7aXjg0hGrMk0qVrXT8geRIpHoBk",
            authDomain: "youy-apps.firebaseapp.com",
            databaseURL: "https://youy-apps-default-rtdb.firebaseio.com",
            projectId: "youy-apps"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

        const firestoreConfig = {
            apiKey: "AIzaSyBkCO7FDQXd89YDf843J4_AtvEFvzzt-R0",
            authDomain: "aztlg-494c3.firebaseapp.com",
            projectId: "aztlg-494c3"
        };
        const secondaryApp = firebase.apps.length > 1 ? firebase.apps[1] : firebase.initializeApp(firestoreConfig, "secondary");
        const fsDb = secondaryApp.firestore();
        const rtdb = firebase.database();

        function addQuestion(data = null) {
            const container = document.getElementById('quiz-content');
            const card = document.createElement('div');
            const type = data ? data.type : 'k_fill';
            card.className = `question-card`;

            const needsKey = (['k_true','k_multi'].includes(type));
            const isStudent = document.body.classList.contains('student-mode');

            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px">
                    <div class="card-meta">
                        <span class="q-number-badge"></span>
                        <select class="type-select" ${isStudent ? 'disabled' : ''} onchange="toggleType(this)">
                            ${Object.entries(typeMap).map(([k,v])=>`<option value="${k}" ${type===k?'selected':''}>${v}</option>`).join('')}
                        </select>
                    </div>
                    <i class="fas fa-times-circle remove-btn" style="color:#cbd5e1; cursor:pointer;" onclick="this.closest('.question-card').remove();updateNumbers();saveAll();"></i>
                </div>
                <div class="q-area">${renderQArea(type, data, isStudent)}</div>
                <div class="ans-grid-area">${renderOptions(type, data, isStudent)}</div>
                <div class="correct-ans-box admin-only" style="${needsKey ? '' : 'display:none'}">
                    <input type="text" placeholder="حرف الإجابة أو نصها" class="correct-input ans-val" value="${data?data.ans||'':''}" oninput="saveAll()">
                </div>
            `;
            container.appendChild(card);
            
            card.querySelectorAll('.opt-pair-row').forEach(row => {
                row.onclick = () => { 
                    const examId = new URLSearchParams(window.location.search).get('exam');
                    if (examId && localStorage.getItem('submitted_' + examId) === 'true') return;
                    if (isStudent) { 
                        card.classList.remove('unanswered-alert');
                        card.querySelectorAll('.opt-pair-row').forEach(r => r.classList.remove('selected-opt')); 
                        row.classList.add('selected-opt');
                    }
                };
            });

            updateNumbers();
            if(!isStudent) saveAll();
        }

        function renderQArea(t, d, isStudent) {
            const readonlyAttr = isStudent ? 'readonly style="background:#f8fafc; cursor:default;"' : '';
            const contenteditableAttr = isStudent ? 'contenteditable="false"' : 'contenteditable="true"';
            
            if (t === 'k_extract') return `<div class="estieab-box" ${contenteditableAttr} oninput="saveAll()" placeholder="النص...">${d?d.text_area||'' : ''}</div><textarea class="q-text-input q-main" ${readonlyAttr} placeholder="السؤال..." oninput="saveAll()">${d?d.text:''}</textarea>`;
            return `<textarea class="q-text-input q-main" ${readonlyAttr} placeholder="اكتب السؤال هنا..." oninput="saveAll()">${d?d.text:''}</textarea>`;
        }

        function renderOptions(t, d, isStudent) {
            if (['k_fill', 'k_irab', 'k_sentence'].includes(t)) {
                const contenteditableAttr = isStudent ? 'contenteditable="true" oninput="this.closest(\'.question-card\').classList.remove(\'unanswered-alert\')"' : 'contenteditable="true"';
                return `<div class="essay-input" ${contenteditableAttr} placeholder="إجابة الطالب هنا..."></div>`;
            }
            let h = '<div class="options-grid">';
            let count = (t === 'k_true') ? 2 : 4;
            for(let i=0; i<count; i++) {
                const readonlyInput = isStudent ? 'readonly style="background:transparent; cursor:pointer;"' : '';
                h+=`<div class="opt-pair-row"><span class="opt-label">${labels[i]}</span><input type="text" class="opt-word opt" ${readonlyInput} placeholder="خيار ${labels[i]}" value="${d?.opts?.[i]||(t==='k_true'?(i===0?'صح':'خطأ'):'')}" oninput="saveAll()"></div>`;
            }
            return h + '</div>';
        }

        function importArrayQuestions() {
            let rawData = document.getElementById('arrayInputText').value.trim();
            if (!rawData) { alert("الرجاء لصق مصفوفة الأسئلة في مربع النص أولاً!"); return; }

            try {
                rawData = rawData.replace(/[\u200B-\u200D\uFEFF]/g, '').trim();
                if (rawData.startsWith("const") || rawData.startsWith("let") || rawData.startsWith("var")) {
                    const equalIndex = rawData.indexOf("=");
                    if (equalIndex !== -1) rawData = rawData.substring(equalIndex + 1).trim();
                }
                if (rawData.endsWith(";")) rawData = rawData.substring(0, rawData.length - 1).trim();

                let arr;
                try { arr = Function('"use strict"; return (' + rawData + ');')(); }
                catch (evalErr) { arr = JSON.parse(rawData); }

                if (!Array.isArray(arr)) { alert("الخطأ: النص المدخل ليس مصفوفة صحيحة!"); return; }

                arr.forEach(item => {
                    let mappedType = 'k_multi';
                    let tName = (item.t || "").trim();
                    if (tName === "استخرج") mappedType = 'k_extract';
                    else if (tName === "صح وخطأ") mappedType = 'k_true';
                    
                    addQuestion({ type: mappedType, text: item.q || "", opts: item.opts || [], ans: item.ans || "" });
                });

                saveAll();
                document.getElementById('arrayInputText').value = "";
                alert(`تم استيراد وتوزيع ${arr.length} سؤالاً بنجاح!`);
            } catch (e) {
                alert("حدث خطأ أثناء قراءة المصفوفة. تأكد من نسخها كاملة بأقواسها.");
            }
        }

        async function verifyStudentEmail() {
            const emailInput = document.getElementById('studentEmailInput').value.trim().toLowerCase();
            const msgEl = document.getElementById('auth-status-msg');

            if (!emailInput || !emailInput.includes('@')) {
                msgEl.style.color = "var(--q-red)";
                msgEl.innerText = "الرجاء إدخال إيميل منصة مدرستي صحيح.";
                return;
            }

            msgEl.style.color = "var(--royal-blue)";
            msgEl.innerText = "جاري التحقق من السجل المدرسي... ⏳";

            try {
                const docRef = await fsDb.collection("allowed_students").doc(emailInput).get();
                if (!docRef.exists) {
                    msgEl.style.color = "var(--q-red)";
                    msgEl.innerText = "❌ هذا الإيميل غير مسجل في قائمة طلاب المدرسة المعتمدين!";
                    return;
                }

                authenticatedStudentEmail = emailInput;
                authenticatedStudentName = docRef.data().name || "طالب";

                const examId = new URLSearchParams(window.location.search).get('exam');
                
                // التحقق من قاعدة بيانات النتائج لمعرفة إن كان قد أدى الاختبار أم لا
                const prevResult = await fsDb.collection("alkfaeat_results")
                    .where("email", "==", authenticatedStudentEmail)
                    .where("model_id", "==", examId).get();

                // إذا قام المعلم بحذف النتيجة من لوحة التحكم، فلن يوجد سجل في Firestore، وسيسمح له بالاختبار
                if (!prevResult.empty) {
                    msgEl.style.color = "var(--q-red)";
                    msgEl.innerText = `عذراً يا ${authenticatedStudentName}، لقد أديت هذا الاختبار مسبقاً ولا يمكنك إعادتة.`;
                    return;
                }

                // مسح أي قفل محلي قديم إن وُجد
                localStorage.removeItem('submitted_' + examId);

                document.getElementById('student-auth-container').style.display = 'none';
                document.querySelector('.container').style.display = 'block';
                document.getElementById('student-actions').style.display = 'block';

                alert(`أهلاً بك يا ${authenticatedStudentName} 🌟. يمكنك البدء في حل الاختبار.`);
            } catch (err) {
                console.error(err);
                msgEl.style.color = "var(--q-red)";
                msgEl.innerText = "حدث خطأ في الاتصال بقاعدة البيانات. حاول مرة أخرى.";
            }
        }

        async function gradeExam() {
            const cards = document.querySelectorAll('.question-card');
            let firstUnansweredIndex = -1;

            cards.forEach((c, index) => {
                c.classList.remove('unanswered-alert');
                const type = c.querySelector('.type-select').value;
                let isAnswered = true;
                
                if (['k_fill', 'k_irab', 'k_sentence'].includes(type)) {
                    if (!c.querySelector('.essay-input').innerText.trim()) isAnswered = false;
                } else {
                    if (!c.querySelector('.selected-opt')) isAnswered = false;
                }

                if (!isAnswered) {
                    c.classList.add('unanswered-alert');
                    if (firstUnansweredIndex === -1) firstUnansweredIndex = index + 1;
                }
            });

            if (firstUnansweredIndex !== -1) {
                alert(`⚠️ تنبيه: لديك سؤال تركته بدون إجابة!\n\n🔴 رقم السؤال غير المجاب: (السؤال رقم ${firstUnansweredIndex})\n\nتم تلوينه باللون الأحمر لتحديد مكانه.`);
                cards[firstUnansweredIndex - 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
                return;
            }

            if (!confirm("هل أنت متأكد من رغبتك في اعتماد النتيجة؟ لن يمكنك التعديل بعد الآن.")) return;

            let s = 0; const report = document.getElementById('report-body'); report.innerHTML = "";
            let details = [];

            cards.forEach((c, i) => {
                const type = c.querySelector('.type-select').value;
                const qTxt = c.querySelector('.q-main')?.value || "سؤال";
                let studentAns = "", correctKey = "", pts = 0;

                if (['k_fill','k_irab','k_sentence'].includes(type)) {
                    studentAns = c.querySelector('.essay-input').innerText;
                    pts = studentAns.length > 1 ? 1 : 0;
                    correctKey = "مراجعة المعلم";
                } else {
                    const selLabel = c.querySelector('.selected-opt .opt-label')?.innerText.replace(')','').trim() || "";
                    const selWord = c.querySelector('.selected-opt .opt')?.value || "";
                    const key = c.querySelector('.ans-val').value.trim();
                    studentAns = selWord || selLabel; correctKey = key; 
                    if (selWord === key || selLabel.toUpperCase() === key.toUpperCase() || selWord.trim() === key.trim()) pts = 1;
                }
                s += pts;
                details.push({ q: qTxt, studentAns: studentAns, correctAns: correctKey, isCorrect: pts > 0 });
                report.innerHTML += `<tr><td>${i+1}</td><td style="text-align:right">${qTxt}</td><td>${studentAns || '--'}</td><td style="color:var(--success-green); font-weight:bold">${correctKey}</td><td>${pts}</td></tr>`;
            });

            const examId = new URLSearchParams(window.location.search).get('exam');
            if(examId && authenticatedStudentEmail) {
                await fsDb.collection("alkfaeat_results").add({
                    name: authenticatedStudentName,
                    email: authenticatedStudentEmail,
                    score: s,
                    total: cards.length,
                    model_id: examId,
                    answers: details,
                    time: firebase.firestore.FieldValue.serverTimestamp()
                });

                localStorage.setItem('submitted_' + examId, 'true');
                document.getElementById('student-actions').innerHTML = '<div style="background:#fee2e2; color:#991b1b; padding:15px; border-radius:10px; font-weight:bold; border:1px solid #fecaca;">تم اعتماد النتيجة بنجاح. لا يمكنك تعديل الإجابات أو إعادة الاختبار.</div>';
            }

            document.getElementById('score-summary').innerText = `النتيجة الإجمالية: ${s} من ${cards.length}`;
            document.getElementById('report-modal').style.display = 'block'; 
            document.getElementById('modal-overlay').style.display = 'block';
        }

        function loadFromCloud() {
            rtdb.ref('models').once('value', s => {
                const ms = s.val();
                if(!ms) { alert("لا توجد أي نماذج محفوظة في السحاب حالياً."); return; }
                
                const modelNames = Object.keys(ms);
                let listStr = "النماذج المحفوظة حالياً في السحاب:\n\n";
                modelNames.forEach((name, index) => { listStr += `${index + 1} - ${name}\n`; });
                listStr += "\nالرجاء كتابة اسم النموذج المراد فتحه تماماً:";

                const c = prompt(listStr);
                if(c && ms[c]) {
                    localStorage.setItem('fifi_final_v_secured', JSON.stringify(ms[c].data));
                    location.reload();
                } else if(c) { alert("اسم النموذج غير صحيح!"); }
            });
        }

        function closeModals() { document.getElementById('report-modal').style.display = 'none'; document.getElementById('analysis-modal').style.display = 'none'; document.getElementById('modal-overlay').style.display = 'none'; }
        function toggleType(s) { const c = s.closest('.question-card'); const val = s.value; c.querySelector('.q-area').innerHTML = renderQArea(val,null,false); c.querySelector('.ans-grid-area').innerHTML = renderOptions(val,null,false); c.querySelector('.correct-ans-box').style.display = (['k_true','k_multi'].includes(val)) ? '' : 'none'; saveAll(); }
        function updateNumbers() { document.querySelectorAll('.q-number-badge').forEach((b, i) => b.innerText = `السؤال ${i+1}`); }
        function saveAll() { 
            const qs = []; 
            document.querySelectorAll('.question-card').forEach(c => { 
                const t = c.querySelector('.type-select').value; 
                let d = { type: t, ans: c.querySelector('.ans-val')?.value || '' }; 
                d.text = c.querySelector('.q-main')?.value || ""; 
                if(t==='k_extract') d.text_area = c.querySelector('.estieab-box').innerText; 
                d.opts = Array.from(c.querySelectorAll('.opt')).map(i => i.value); 
                qs.push(d); 
            }); 
            localStorage.setItem('fifi_final_v_secured', JSON.stringify(qs)); 
        }

        function loadQuestions() { 
            const id = new URLSearchParams(window.location.search).get('exam'); 
            if (id) { 
                document.body.classList.add('student-mode'); 
                document.getElementById('student-auth-container').style.display = 'block';

                rtdb.ref('models/' + id).once('value', s => { 
                    if (s.val() && s.val().data) {
                        loadedExamQuestions = s.val().data;
                        loadedExamQuestions.forEach(q => addQuestion(q));
                    } else {
                        alert("هذا النموذج غير موجود أو تم حذفه من السحاب.");
                    }
                }); 
            } else { 
                const s = localStorage.getItem('fifi_final_v_secured'); 
                document.querySelector('.container').style.display = 'block';
                if(s) { JSON.parse(s).forEach(q => addQuestion(q)); }
            } 
        }

        async function saveToCloud() { 
            const n = prompt("اسم النموذج:"); 
            if(n) { 
                await rtdb.ref('models/' + n).set({ teacher: "أ. عبدالعزيز الفيفي", data: JSON.parse(localStorage.getItem('fifi_final_v_secured')), date: new Date().toLocaleString() }); 
                alert("تم الحفظ بنجاح!"); 
            } 
        }

        function generateStudentLink() { 
            const n = prompt("اسم النموذج:"); 
            if(n) prompt("رابط الاختبار للطلاب:", window.location.origin + window.location.pathname + "?exam=" + encodeURIComponent(n)); 
        }

        function clearAll() {
            if(confirm("هل أنت متأكد من مسح جميع الأسئلة؟")) {
                document.getElementById('quiz-content').innerHTML = '';
                localStorage.removeItem('fifi_final_v_secured');
            }
        }

        window.onload = function() { loadQuestions(); };
    </script>
</body>
</html>
