<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أ. عبدالعزيز الفيفي - النسخة المعتمدة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { 
            --royal-blue: #1e3a8a; --q-red: #ef4444; --bg-page: #f8fafc; 
            --success-green: #10b981; --k-purple: #7c3aed; --card-border: #e2e8f0;
            --text-color: #1e293b; --card-bg: #ffffff;
        }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, Arial; 
            background: var(--bg-page); color: var(--text-color); margin: 0; padding: 20px; 
            display: flex; flex-direction: column; align-items: center; line-height: 1.6;
            transition: background 0.5s ease, color 0.5s ease;
        }

        .user-header {
            width: 100%; max-width: 850px; background: var(--card-bg); border-radius: 15px; padding: 20px;
            display: flex; justify-content: space-between; align-items: center; text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-bottom: 5px solid var(--royal-blue); 
            margin-bottom: 20px; box-sizing: border-box; gap: 15px; flex-wrap: wrap; transition: background 0.5s;
        }
        .header-right { flex: 1; text-align: right; min-width: 140px; }
        .header-center { flex: 0 0 auto; display: flex; justify-content: center; }
        .header-left { flex: 1; text-align: left; min-width: 140px; }

        .user-name { margin: 0; color: var(--royal-blue); font-weight: bold; font-size: 1.3rem; }
        .school-name { margin: 0; color: #64748b; font-weight: bold; font-size: 0.95rem; }
        .logo-box { background: var(--royal-blue); width: 55px; height: 55px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.4rem; transition: background 0.5s; }

        .top-action-bar {
            width: 100%; max-width: 850px; background: #1e293b; border-radius: 15px; padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 25px; box-sizing: border-box; gap: 10px; flex-wrap: wrap; z-index: 999;
        }
        .bar-group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

        .array-import-box, .search-result-box {
            width: 100%; max-width: 850px; background: var(--card-bg); border-radius: 15px; padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 2px dashed #0284c7; margin-bottom: 25px; box-sizing: border-box; transition: background 0.5s;
        }
        .array-textarea {
            width: 100%; height: 120px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px;
            font-family: monospace; font-size: 0.9rem; direction: ltr; text-align: left; outline: none; box-sizing: border-box; resize: vertical; margin-bottom: 10px;
        }

        .auth-card {
            background: var(--card-bg); width: 100%; max-width: 850px; border-radius: 20px; padding: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; box-sizing: border-box; margin-bottom: 25px; transition: background 0.5s;
        }
        .auth-input { width: 80%; max-width: 400px; padding: 15px; border-radius: 10px; border: 2px solid #cbd5e1; margin-bottom: 15px; text-align: center; font-size: 1.1rem; outline: none; }

        .container { width: 100%; max-width: 850px; padding-bottom: 120px; display: none; }
        .question-card { background: var(--card-bg); border-radius: 20px; padding: 25px; margin-bottom: 25px; border: 2px solid var(--card-border); position: relative; text-align: right; box-sizing: border-box; transition: 0.3s, background 0.5s; }
        .question-card::before { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 8px; background: var(--k-purple); transition: background 0.5s; }
        
        .question-card.unanswered-alert { border: 2px solid var(--q-red) !important; background-color: #fff5f5; }
        .question-card.unanswered-alert .q-number-badge { background-color: var(--q-red) !important; }

        .card-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .q-number-badge { background: var(--k-purple); color: white; padding: 2px 15px; border-radius: 50px; font-weight: bold; font-size: 0.9rem; transition: background 0.5s; }
        .type-select, .score-input-q { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 6px 10px; border-radius: 10px; font-weight: bold; font-family: inherit; cursor: pointer; }

        .estieab-box { background: #fff9c4 !important; border: 2px solid #fbc02d; border-radius: 12px; padding: 15px; margin-bottom: 15px; color: #000; font-weight: bold; line-height: 1.8; width: 100%; box-sizing: border-box; text-align: right; min-height: 90px; outline: none; white-space: pre-wrap; font-size: 1.15rem; }
        
        .q-text-input { 
            width: 100%; min-height: 70px; padding: 15px; border: 2px solid #cbd5e1; border-radius: 12px; 
            color: inherit; font-weight: bold; font-size: 1.2rem; margin-bottom: 15px; outline: none; 
            text-align: right; box-sizing: border-box; word-wrap: break-word; font-family: inherit; 
            background: rgba(0,0,0,0.02); line-height: 1.8; overflow: hidden; resize: none; 
        }

        .essay-input { width: 100%; min-height: 70px; padding: 12px; border: 2px inset #e2e8f0; border-radius: 12px; background: rgba(0,0,0,0.02); font-weight: bold; color: inherit; margin-top: 10px; outline: none; text-align: right; font-size: 1.1rem; }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 600px) {
            .options-grid { display: flex; flex-direction: column; }
        }

        .opt-pair-row { display: flex; align-items: center; background: var(--card-bg); border: 1.5px solid #d1d5db; border-radius: 10px; padding: 12px; box-sizing: border-box; cursor: pointer; transition: 0.2s, background 0.5s; gap: 8px; }
        .opt-label { font-weight: bold; color: var(--royal-blue); white-space: nowrap; font-size: 1.05rem; flex-shrink: 0; }
        .opt-word { width: 100%; border: none; outline: none; font-weight: bold; color: inherit; background: transparent; text-align: right; font-family: inherit; cursor: inherit; font-size: 1.05rem; }

        .correct-ans-box { margin-top: 15px; padding: 10px; background: rgba(16, 185, 129, 0.1); border-radius: 10px; border: 1px solid #bbf7d0; text-align: right; }
        .correct-input { width: 100%; background: transparent; border: none; outline: none; color: #166534; font-weight: bold; text-align: right; font-family: inherit; }

        .btn { border: none; padding: 8px 14px; border-radius: 20px; font-weight: bold; cursor: pointer; color: white; display: flex; align-items: center; gap: 6px; transition: 0.3s; font-family: inherit; font-size: 0.85rem; white-space: nowrap; }
        .btn-add { background: #3b82f6; } .btn-save { background: #a855f7; } .btn-load { background: #4f46e5; }
        .btn-link { background: #06b6d4; } .btn-del { background: #ef4444; } .btn-rename { background: #f59e0b; }
        .btn-new { background: #10b981; }
        .btn-clear { background: #64748b; padding: 8px; border-radius: 50%; }

        body.student-mode .top-action-bar, body.student-mode .array-import-box, body.student-mode .search-result-box, body.student-mode .remove-btn, body.student-mode .type-select, body.student-mode .correct-ans-box, body.student-mode .admin-only, body.student-mode .score-setting-box, body.student-mode .sub-score-box { display: none !important; }
        body.student-mode .selected-opt { background: rgba(59, 130, 246, 0.2) !important; border: 2px solid var(--royal-blue) !important; }

        #report-modal, #cloud-modal, #history-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 95%; max-width: 700px; max-height: 85%; background: #ffffff; color: #1e293b; z-index: 2000; border-radius: 20px; padding: 25px; overflow-y: auto; box-shadow: 0 0 50px rgba(0,0,0,0.4); }
        .report-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .report-table th, .report-table td { padding: 12px; border: 1px solid #e2e8f0; text-align: center; }
        
        .cloud-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; border-bottom: 1px solid #e2e8f0; gap: 10px; flex-wrap: wrap; }
        .cloud-item:hover { background: #f8fafc; }

        /* جداول المزاوجة */
        .matching-table { width: 100%; border-collapse: collapse; margin: 10px 0; }
        .matching-table th, .matching-table td { border: 1px solid #cbd5e1; padding: 8px; text-align: center; }
        .matching-input { width: 100%; border: none; outline: none; font-weight: bold; background: transparent; text-align: center; font-family: inherit; }
        .student-match-select { padding: 5px; border-radius: 6px; font-weight: bold; font-family: inherit; }
        .item-score-input { width: 45px; text-align: center; font-weight: bold; border: 1px solid #cbd5e1; border-radius: 6px; padding: 2px; }
    </style>
</head>
<body>

    <script>
        const themes = [
            { bg: "#f8fafc", primary: "#1e3a8a", purple: "#7c3aed", text: "#1e293b", card: "#ffffff", border: "#e2e8f0" },
            { bg: "#fdf4ff", primary: "#86198f", purple: "#c084fc", text: "#1e293b", card: "#ffffff", border: "#f5d0fe" },
            { bg: "#f0fdf4", primary: "#166534", purple: "#059669", text: "#1e293b", card: "#ffffff", border: "#bbf7d0" },
            { bg: "#fffbeb", primary: "#b45309", purple: "#d97706", text: "#1e293b", card: "#ffffff", border: "#fde68a" },
            { bg: "#fdf2f8", primary: "#9d174d", purple: "#db2777", text: "#1e293b", card: "#ffffff", border: "#fbcfe8" },
            { bg: "#f0f9ff", primary: "#0369a1", purple: "#0284c7", text: "#1e293b", card: "#ffffff", border: "#bae6fd" }
        ];

        const selectedTheme = themes[Math.floor(Math.random() * themes.length)];
        const root = document.documentElement;
        root.style.setProperty('--royal-blue', selectedTheme.primary);
        root.style.setProperty('--k-purple', selectedTheme.purple);
        root.style.setProperty('--bg-page', selectedTheme.bg);
        root.style.setProperty('--text-color', selectedTheme.text);
        root.style.setProperty('--card-bg', selectedTheme.card);
        root.style.setProperty('--card-border', selectedTheme.border);
    </script>

    <div id="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1999;" onclick="closeModals()"></div>
    
    <div id="cloud-modal">
        <h2 style="text-align: center; color: var(--royal-blue); margin-top:0;"><i class="fas fa-cloud"></i> النماذج المحفوظة في السحاب</h2>
        <p style="text-align: center; color: #64748b; font-size: 0.9rem;">اختر النموذج لفتحه أو حذفه:</p>
        <div id="cloud-models-list" style="margin-top: 20px; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden;"></div>
        <button class="btn" style="background:#64748b; width:100%; margin-top:20px; justify-content:center;" onclick="closeModals()">إغلاق</button>
    </div>

    <!-- نافذة سجل النتائج -->
    <div id="history-modal">
        <h2 style="text-align: center; color: var(--royal-blue);"><i class="fas fa-history"></i> سجل نتائج الاختبارات 📊</h2>
        <div id="history-list" style="margin-top: 20px;"></div>
        <button class="btn" style="background:#64748b; width:100%; margin-top:20px; justify-content:center;" onclick="closeModals()">إغلاق السجل</button>
    </div>

    <div id="report-modal">
        <h2 style="text-align: center; color: var(--royal-blue);" id="report-modal-title">تقرير أداء الطالب 🎯</h2>
        <div id="score-summary" style="text-align: center; font-size: 1.4rem; font-weight: bold; margin: 20px 0;"></div>
        <table class="report-table">
            <thead>
                <tr id="report-table-header"><th>#</th><th>السؤال</th><th>إجابتك</th><th>الصحيحة</th><th>الدرجة</th></tr>
            </thead>
            <tbody id="report-body"></tbody>
        </table>
        <div id="save-review-btn-container" style="margin-top: 20px; text-align: center;"></div>
        <button class="btn" style="background:#64748b; width:100%; margin-top:10px; justify-content:center;" onclick="closeModals()">إغلاق التقرير</button>
    </div>

    <div class="user-header" id="main-header">
        <div class="header-right"><h2 class="user-name">أ. عبدالعزيز الفيفي</h2></div>
        <div class="header-center"><div class="logo-box"><i class="fas fa-award"></i></div></div>
        <div class="header-left"><p class="school-name">ثانوية الأمير عبدالمجيد 😉</p></div>
    </div>

    <div class="top-action-bar admin-only" id="admin-top-bar">
        <div class="bar-group">
            <span id="current-model-label" style="color: #38bdf8; font-weight: bold; font-size: 0.95rem; margin-left: 5px;">📁 نموذج جديد</span>
            <button class="btn btn-new" onclick="startNewModel()"><i class="fas fa-plus-circle"></i> قبل أبدأ (جديد)</button>
            <button class="btn btn-save" onclick="saveToCloud()"><i class="fas fa-save"></i> حفظ</button>
            <button class="btn btn-link" onclick="copyCurrentModelLink()"><i class="fas fa-link"></i> رابط الطلاب</button>
            <button class="btn btn-rename" onclick="renameCurrentModel()"><i class="fas fa-signature"></i> إعادة تسمية</button>
            <button class="btn btn-del" onclick="deleteCurrentModel()"><i class="fas fa-trash"></i> حذف</button>
        </div>
        <div class="bar-group">
            <button class="btn btn-load" onclick="loadFromCloud()"><i class="fas fa-folder-open"></i> فتح نموذج</button>
            <button class="btn btn-add" onclick="addQuestion()"><i class="fas fa-plus"></i> سؤال</button>
            <button class="btn btn-clear" title="مسح الكل" onclick="clearAll()"><i class="fas fa-eraser"></i></button>
        </div>
    </div>

    <div id="student-auth-container" style="display:none;">
        <div class="auth-card">
            <h2 style="color: var(--royal-blue); margin-top: 0;">تسجيل دخول الطالب 🎓</h2>
            <p style="color: #64748b; margin-bottom: 20px;">الرجاء إدخال إيميل منصة مدرستي المعتمد لبدء الاختبار:</p>
            <input type="email" id="studentEmailInput" class="auth-input" placeholder="sxxxxxxx@rb.moe.gov.sa">
            <br>
            <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                <button class="btn" style="background: var(--success-green); padding: 12px 30px; font-size: 1.1rem;" onclick="verifyStudentEmail()">دخول المنصة 🚀</button>
                <button class="btn" style="background: var(--royal-blue); padding: 12px 20px; font-size: 1rem;" onclick="openStudentHistory()"><i class="fas fa-history"></i> سجل اختباراتي 📊</button>
            </div>
            <p id="auth-status-msg" style="margin-top: 15px; font-weight: bold;"></p>
        </div>
    </div>

    <div class="search-result-box admin-only">
        <label style="display: block; font-weight: bold; color: #0284c7; margin-bottom: 8px;"><i class="fas fa-search"></i> استعلام ومراجعة درجات طالب بإيميله المدرسي (خاص بالمعلم):</label>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <input type="email" id="teacherSearchEmail" class="auth-input" style="flex: 1; margin: 0; font-size: 1rem; padding: 10px;" placeholder="أدخل إيميل الطالب هنا sxxxxxxx@rb.moe.gov.sa">
            <button class="btn" style="background: #0284c7; padding: 10px 20px;" onclick="teacherSearchByEmail()"><i class="fas fa-search"></i> بحث ومراجعة</button>
        </div>
    </div>

    <div class="array-import-box admin-only">
        <label style="display: block; font-weight: bold; color: #0284c7; margin-bottom: 8px;"><i class="fas fa-file-code"></i> استيراد مصفوفة أسئلة جماعية (الصق هنا مباشرة):</label>
        <textarea id="arrayInputText" class="array-textarea" placeholder="الصق مصفوفة الـ JS هنا (مع أو بدون const rawQuizData = [...])"></textarea>
        <button class="btn" style="background:#0284c7;" onclick="importArrayQuestions()"><i class="fas fa-magic"></i> توليد وتوزيع الأسئلة تلقائياً</button>
    </div>

    <div class="container" id="quiz-content"></div>

    <div id="student-actions" style="display: none; text-align: center; margin-bottom: 50px; gap: 10px; justify-content: center; flex-wrap: wrap;">
        <button id="main-grade-btn" class="btn" style="background:#10b981; padding:15px 30px" onclick="gradeExam()"><i class="fas fa-graduation-cap"></i> انتهيت.. اعتماد النتيجة</button>
        <button class="btn" style="background:var(--royal-blue); padding:15px 25px;" onclick="openStudentHistory()"><i class="fas fa-history"></i> سجل اختباراتي السابقة 📊</button>
    </div>

    <script>
        let authenticatedStudentEmail = "";
        let authenticatedStudentName = "";
        let loadedExamQuestions = null;
        let currentOpenModelName = null;

        const typeMap = {
            'k_fill': 'أكمل الفراغ', 'k_irab': 'أعرب ما تحته خط', 'k_sentence': 'مثل في جملة مفيدة',
            'k_extract': 'استخرج من النص', 'k_true': 'صح وخطأ', 'k_multi': 'اختر الإجابة الصحيحة',
            'k_custom_opts': 'سؤال عدد (خيارات بعدد مخصص)', 'k_matching': 'سؤال مزاوجة (عمود أ و ب)'
        };
        const labels = ['أ) ', 'ب) ', 'ج) ', 'د) ', 'هـ) ', 'و) ', 'ز) ', 'ح) '];

        const firebaseConfig = {
            apiKey: "AIzaSyAVrIim7aXjg0hGrMk0qVrXT8geRIpHoBk",
            authDomain: "youy-apps.firebaseapp.com",
            databaseURL: "https://youy-apps-default-rtdb.firebaseio.com",
            projectId: "youy-apps"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

        const firestoreConfig = {
            apiKey: "AIzaSyBkCO7FDQXd89YDf843J4_AtvEFvzzt-R0",
            authDomain: "aztlg-494c3.firebaseapp.com",
            projectId: "aztlg-494c3"
        };
        const secondaryApp = firebase.apps.length > 1 ? firebase.apps[1] : firebase.initializeApp(firestoreConfig, "secondary");
        const fsDb = secondaryApp.firestore();
        const rtdb = firebase.database();

        function autoResizeTextarea(el) {
            el.style.height = 'auto';
            el.style.height = (el.scrollHeight) + 'px';
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startNewModel() {
            if(confirm("هل ترغب في البدء بنموذج جديد؟ سيتم تفريغ الأسئلة الحالية.")) {
                document.getElementById('quiz-content').innerHTML = '';
                localStorage.removeItem('fifi_final_v_secured');
                currentOpenModelName = null;
                document.getElementById('current-model-label').innerText = "📁 نموذج جديد";
                addQuestion();
            }
        }

        function addQuestion(data = null) {
            const container = document.getElementById('quiz-content');
            const card = document.createElement('div');
            const type = data ? data.type : 'k_fill';
            const qScore = data ? (data.score !== undefined ? data.score : 1) : 1;
            card.className = `question-card`;

            const needsKey = (['k_true','k_multi','k_custom_opts'].includes(type));
            const isStudent = document.body.classList.contains('student-mode');
            const qTextVal = data ? (data.text || "") : "";
            const qTextAreaVal = data ? (data.text_area || "") : "";
            const correctAnsVal = data ? (data.ans || "") : "";
            const fullQuestionText = (type === 'k_extract' && qTextAreaVal) ? (qTextAreaVal + "\n\n" + qTextVal) : qTextVal;

            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px">
                    <div class="card-meta">
                        <span class="q-number-badge"></span>
                        <select class="type-select" ${isStudent ? 'disabled' : ''} onchange="toggleType(this)">
                            ${Object.entries(typeMap).map(([k,v])=>`<option value="${k}" ${type===k?'selected':''}>${v}</option>`).join('')}
                        </select>
                        <div class="score-setting-box admin-only" style="display:${(['k_matching','k_custom_opts'].includes(type)) ? 'none' : 'inline-flex'}; align-items:center; gap:5px; margin-right:10px;">
                            <span style="font-size:0.85rem; font-weight:bold; color:var(--royal-blue);">الدرجة:</span>
                            <input type="number" class="score-input-q" value="${qScore}" min="0.5" step="0.5" style="width:55px;" oninput="saveAll()">
                        </div>
                    </div>
                    <i class="fas fa-times-circle remove-btn" style="color:#cbd5e1; cursor:pointer;" onclick="this.closest('.question-card').remove();updateNumbers();saveAll();"></i>
                </div>
                <div class="q-area">
                    ${type === 'k_extract' ? `<div class="estieab-box" ${isStudent ? 'contenteditable="false"' : 'contenteditable="true" oninput="saveAll()"'}>${qTextAreaVal}</div>` : ''}
                    ${isStudent ? `<div class="q-text-input" style="cursor:default; overflow:visible; height:auto;">${qTextVal}</div>` : `<textarea class="q-text-input q-main" placeholder="اكتب السؤال هنا...">${qTextVal}</textarea>`}
                </div>
                <div class="ans-grid-area">${renderOptions(type, data, isStudent)}</div>
                <div class="correct-ans-box admin-only" style="${needsKey ? '' : 'display:none'}">
                    <input type="text" placeholder="حرف الإجابة أو نصها الصحيح" class="correct-input ans-val" value="${correctAnsVal}" oninput="saveAll()">
                </div>
                <input type="hidden" class="hidden-correct-ans" value="${correctAnsVal}">
                <input type="hidden" class="hidden-q-text" value="${fullQuestionText}">
            `;
            container.appendChild(card);
            
            card.querySelectorAll('textarea').forEach(ta => {
                autoResizeTextarea(ta);
                ta.addEventListener('input', function() { autoResizeTextarea(this); saveAll(); });
            });

            card.querySelectorAll('.opt-pair-row').forEach(row => {
                row.onclick = () => { 
                    const examId = new URLSearchParams(window.location.search).get('exam');
                    if (examId && localStorage.getItem('submitted_' + examId) === 'true') return;
                    if (isStudent) { 
                        card.classList.remove('unanswered-alert');
                        card.querySelectorAll('.opt-pair-row').forEach(r => r.classList.remove('selected-opt')); 
                        row.classList.add('selected-opt');
                    }
                };
            });

            updateNumbers();
            if(!isStudent) saveAll();
        }

        function renderOptions(t, d, isStudent) {
            if (['k_fill', 'k_irab', 'k_sentence'].includes(t)) {
                const contenteditableAttr = isStudent ? 'contenteditable="true" oninput="this.closest(\'.question-card\').classList.remove(\'unanswered-alert\')"' : 'contenteditable="true"';
                return `<div class="essay-input" ${contenteditableAttr} placeholder="إجابة الطالب هنا..."></div>`;
            }

            if (t === 'k_custom_opts' || t === 'k_multi' || t === 'k_true') {
                let optCount = d?.opts ? d.opts.length : (t === 'k_true' ? 2 : (t === 'k_custom_opts' ? 3 : 4));
                let opts = d?.opts ? [...d.opts] : (t === 'k_true' ? ['صح', 'خطأ'] : Array(optCount).fill(''));
                let optScores = d?.optScores || Array(optCount).fill(1);
                
                let countSelector = '';
                if (!isStudent && t === 'k_custom_opts') {
                    countSelector = `
                        <div style="margin-bottom:12px; background:rgba(2,132,199,0.05); padding:8px 12px; border-radius:8px;" class="admin-only">
                            <label style="font-weight:bold; font-size:0.9rem; color:#0284c7;">عدد الأيقونات (الخيارات): </label>
                            <select onchange="updateCustomOptCount(this, ${isStudent})" style="padding:4px; border-radius:6px; font-weight:bold;">
                                ${[2,3,4,5,6,7,8].map(n => `<option value="${n}" ${opts.length===n?'selected':''}>${n} أيقونات</option>`).join('')}
                            </select>
                        </div>
                    `;
                }

                if (isStudent && opts.length > 0) opts = shuffleArray(opts);

                let h = countSelector + '<div class="options-grid">';
                for(let i=0; i<opts.length; i++) {
                    const readonlyInput = isStudent ? 'readonly style="background:transparent; cursor:pointer;"' : '';
                    const scoreBox = (!isStudent && t === 'k_custom_opts') ? `<div class="sub-score-box admin-only" style="display:flex; align-items:center; gap:2px;"><span style="font-size:0.75rem; color:#64748b;">درجة:</span><input type="number" step="0.5" min="0" value="${optScores[i]!==undefined?optScores[i]:1}" class="item-score-input opt-score-val" oninput="saveAll()"></div>` : '';
                    
                    h+=`<div class="opt-pair-row"><span class="opt-label">${labels[i] || (i+1)+') '}</span><input type="text" class="opt-word opt" ${readonlyInput} placeholder="خيار ${i+1}" value="${opts[i]||''}" oninput="saveAll()">${scoreBox}</div>`;
                }
                return h + '</div>';
            }

            if (t === 'k_matching') {
                let colA = d?.matchA || ['', '', ''];
                let colB = d?.matchB || ['', '', '', ''];
                let answers = d?.matchAns || Array(colA.length).fill('');
                let itemScores = d?.matchScores || Array(colA.length).fill(1);

                let adminControls = '';
                if (!isStudent) {
                    adminControls = `
                        <div style="display:flex; gap:15px; margin-bottom:12px; background:rgba(2,132,199,0.05); padding:8px 12px; border-radius:8px;" class="admin-only">
                            <div>
                                <label style="font-weight:bold; font-size:0.85rem; color:#0284c7;">عدد فقرات العمود أ: </label>
                                <input type="number" min="1" max="10" value="${colA.length}" onchange="updateMatchingRows(this, 'A')" style="width:45px; text-align:center; font-weight:bold;">
                            </div>
                            <div>
                                <label style="font-weight:bold; font-size:0.85rem; color:#0284c7;">عدد خيارات العمود ب: </label>
                                <input type="number" min="1" max="10" value="${colB.length}" onchange="updateMatchingRows(this, 'B')" style="width:45px; text-align:center; font-weight:bold;">
                            </div>
                        </div>
                    `;
                }

                let html = adminControls + `<table class="matching-table">
                    <thead><tr>${!isStudent ? '<th>الدرجة</th>' : ''}<th>الرقم المناسب</th><th>العمود (أ)</th><th>الرقم</th><th>العمود (ب)</th></tr></thead>
                    <tbody>`;

                let maxRows = Math.max(colA.length, colB.length);
                for(let i = 0; i < maxRows; i++) {
                    let textA = colA[i] !== undefined ? colA[i] : '';
                    let textB = colB[i] !== undefined ? colB[i] : '';
                    let correctNum = answers[i] || '';
                    let itemScore = itemScores[i] !== undefined ? itemScores[i] : 1;

                    html += `<tr>`;
                    
                    if (i < colA.length) {
                        if (!isStudent) {
                            html += `<td style="width:50px;"><input type="number" step="0.5" min="0" value="${itemScore}" class="item-score-input match-item-score" oninput="saveAll()"></td>`;
                        }

                        if (isStudent) {
                            let selectOpts = `<option value="">-- اختر --</option>`;
                            for(let j=0; j<colB.length; j++) {
                                selectOpts += `<option value="${j+1}">${j+1}</option>`;
                            }
                            html += `<td><select class="student-match-select match-student-ans" onchange="this.closest('.question-card').classList.remove('unanswered-alert')">${selectOpts}</select></td>`;
                        } else {
                            html += `<td><input type="number" min="1" max="${colB.length}" class="matching-input match-ans-key" placeholder="الرقم" value="${correctNum}" oninput="saveAll()"></td>`;
                        }
                        html += `<td>${isStudent ? `<div>${textA}</div>` : `<input type="text" class="matching-input match-a-text" value="${textA}" placeholder="فقرة ${i+1}" oninput="saveAll()">`}</td>`;
                    } else {
                        if(!isStudent) html += `<td style="background:#f1f5f9;"></td>`;
                        html += `<td style="background:#f1f5f9;"></td><td style="background:#f1f5f9;"></td>`;
                    }

                    if (i < colB.length) {
                        html += `<td style="font-weight:bold; color:var(--royal-blue);">${i+1}</td>`;
                        html += `<td>${isStudent ? `<div>${textB}</div>` : `<input type="text" class="matching-input match-b-text" value="${textB}" placeholder="خيار ${i+1}" oninput="saveAll()">`}</td>`;
                    } else {
                        html += `<td style="background:#f1f5f9;"></td><td style="background:#f1f5f9;"></td>`;
                    }

                    html += `</tr>`;
                }

                html += `</tbody></table>`;
                return html;
            }

            return '';
        }

        function updateCustomOptCount(selectEl, isStudent) {
            const card = selectEl.closest('.question-card');
            const count = parseInt(selectEl.value);
            const currentOpts = Array.from(card.querySelectorAll('.opt')).map(i => i.value);
            const currentScores = Array.from(card.querySelectorAll('.opt-score-val')).map(i => parseFloat(i.value) || 1);
            
            let newOpts = [];
            let newScores = [];
            for(let i=0; i<count; i++) {
                newOpts.push(currentOpts[i] || '');
                newScores.push(currentScores[i] !== undefined ? currentScores[i] : 1);
            }
            card.querySelector('.ans-grid-area').innerHTML = renderOptions('k_custom_opts', { opts: newOpts, optScores: newScores }, isStudent);
            saveAll();
        }

        function updateMatchingRows(inputEl, colType) {
            const card = inputEl.closest('.question-card');
            let colA = Array.from(card.querySelectorAll('.match-a-text')).map(i => i.value);
            let colB = Array.from(card.querySelectorAll('.match-b-text')).map(i => i.value);
            let ans = Array.from(card.querySelectorAll('.match-ans-key')).map(i => i.value);
            let scores = Array.from(card.querySelectorAll('.match-item-score')).map(i => parseFloat(i.value) || 1);

            const num = parseInt(inputEl.value) || 1;
            if (colType === 'A') {
                while(colA.length < num) { colA.push(''); scores.push(1); }
                colA = colA.slice(0, num);
                scores = scores.slice(0, num);
            } else {
                while(colB.length < num) colB.push('');
                colB = colB.slice(0, num);
            }

            card.querySelector('.ans-grid-area').innerHTML = renderOptions('k_matching', { matchA: colA, matchB: colB, matchAns: ans, matchScores: scores }, false);
            saveAll();
        }

        function importArrayQuestions() {
            let rawData = document.getElementById('arrayInputText').value.trim();
            if (!rawData) { alert("الرجاء لصق مصفوفة الأسئلة في مربع النص أولاً!"); return; }

            try {
                rawData = rawData.replace(/[\u200B-\u200D\uFEFF]/g, '').trim();
                if (rawData.startsWith("const") || rawData.startsWith("let") || rawData.startsWith("var")) {
                    const equalIndex = rawData.indexOf("=");
                    if (equalIndex !== -1) rawData = rawData.substring(equalIndex + 1).trim();
                }
                if (rawData.endsWith(";")) rawData = rawData.substring(0, rawData.length - 1).trim();

                let arr;
                try { arr = Function('"use strict"; return (' + rawData + ');')(); }
                catch (evalErr) { arr = JSON.parse(rawData); }

                if (!Array.isArray(arr)) { alert("الخطأ: النص المدخل ليس مصفوفة صحيحة!"); return; }

                arr.forEach(item => {
                    let mappedType = 'k_multi';
                    let tName = (item.t || "").trim();
                    if (tName === "استخرج") mappedType = 'k_extract';
                    else if (tName === "صح وخطأ") mappedType = 'k_true';
                    
                    addQuestion({ type: mappedType, text: item.q || "", text_area: item.text_area || "", opts: item.opts || [], ans: item.ans || "", score: item.score || 1 });
                });

                saveAll();
                document.getElementById('arrayInputText').value = "";
                alert(`تم استيراد وتوزيع ${arr.length} سؤالاً بنجاح!`);
            } catch (e) {
                alert("حدث خطأ أثناء قراءة المصفوفة. تأكد من نسخها كاملة بأقواسها.");
            }
        }

        async function saveGradeChanges(docId, total) {
            const inputs = document.querySelectorAll('.score-edit-input');
            let newScore = 0;

            const docRef = fsDb.collection("alkfaeat_results").doc(docId);
            const docSnap = await docRef.get();
            if (!docSnap.exists) { alert("حدث خطأ، لم يتم العثور على سجل الطالب."); return; }

            let answersArray = docSnap.data().answers || [];

            inputs.forEach((inp) => {
                const idx = parseInt(inp.getAttribute('data-index'));
                const val = parseFloat(inp.value) || 0;
                newScore += val;
                if (answersArray[idx]) {
                    answersArray[idx].gotScore = val;
                    answersArray[idx].isCorrect = (val > 0);
                }
            });

            await docRef.update({
                score: newScore,
                answers: answersArray
            });

            alert(`تم حفظ التعديلات بنجاح! النتيجة الجديدة المحدثة: ${newScore} من ${total}`);
            closeModals();
        }

        async function gradeExam() {
            const cards = document.querySelectorAll('.question-card');
            let firstUnansweredIndex = -1;

            cards.forEach((c, index) => {
                c.classList.remove('unanswered-alert');
                const type = c.querySelector('.type-select').value;
                let isAnswered = true;
                
                if (['k_fill', 'k_irab', 'k_sentence'].includes(type)) {
                    if (!c.querySelector('.essay-input').innerText.trim()) isAnswered = false;
                } else if (type === 'k_matching') {
                    const selects = c.querySelectorAll('.match-student-ans');
                    selects.forEach(s => { if(!s.value) isAnswered = false; });
                } else {
                    if (!c.querySelector('.selected-opt')) isAnswered = false;
                }

                if (!isAnswered) {
                    c.classList.add('unanswered-alert');
                    if (firstUnansweredIndex === -1) firstUnansweredIndex = index + 1;
                }
            });

            if (firstUnansweredIndex !== -1) {
                alert(`⚠️ تنبيه: لديك سؤال تركته بدون إجابة!\n\n🔴 رقم السؤال غير المجاب: (السؤال رقم ${firstUnansweredIndex})\n\nتم تلوينه باللون الأحمر لتحديد مكانه.`);
                cards[firstUnansweredIndex - 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
                return;
            }

            if (!confirm("هل أنت متأكد من رغبتك في اعتماد النتيجة؟ لن يمكنك التعديل بعد الآن.")) return;

            let totalExamScore = 0;
            let studentAchievedScore = 0;
            const report = document.getElementById('report-body'); report.innerHTML = "";
            let details = [];

            cards.forEach((c, i) => {
                const type = c.querySelector('.type-select').value;
                const qTxt = c.querySelector('.hidden-q-text')?.value || c.querySelector('.q-text-input')?.innerText || c.querySelector('.q-main')?.value || "سؤال";
                
                let qMaxScore = 0;
                let pts = 0;
                let studentAns = "", correctKey = "";

                if (['k_fill','k_irab','k_sentence'].includes(type)) {
                    qMaxScore = parseFloat(c.querySelector('.score-input-q')?.value) || 1;
                    studentAns = c.querySelector('.essay-input').innerText;
                    pts = studentAns.length > 1 ? qMaxScore : 0;
                    correctKey = "مراجعة المعلم";
                } else if (type === 'k_custom_opts') {
                    const selRow = c.querySelector('.selected-opt');
                    const selWord = selRow ? selRow.querySelector('.opt')?.value || "" : "";
                    const key = c.querySelector('.hidden-correct-ans')?.value.trim() || c.querySelector('.ans-val')?.value.trim() || "";
                    
                    const optRows = Array.from(c.querySelectorAll('.opt-pair-row'));
                    const selectedIdx = optRows.findIndex(r => r.classList.contains('selected-opt'));
                    const optScores = Array.from(c.querySelectorAll('.opt-score-val')).map(s => parseFloat(s.value) || 1);

                    qMaxScore = optScores[selectedIdx] !== undefined ? optScores[selectedIdx] : 1;
                    studentAns = selWord; 
                    correctKey = key; 
                    if (selWord.trim() === key.trim()) pts = qMaxScore;
                } else if (type === 'k_matching') {
                    const studentSelects = c.querySelectorAll('.match-student-ans');
                    const ansKeys = c.querySelectorAll('.match-ans-key');
                    const itemScores = Array.from(c.querySelectorAll('.match-item-score')).map(s => parseFloat(s.value) || 1);

                    let studentMatches = [];
                    let correctMatches = [];

                    studentSelects.forEach((sel, idx) => {
                        let sVal = sel.value;
                        let keyVal = ansKeys[idx] ? ansKeys[idx].value : '';
                        let iScore = itemScores[idx] !== undefined ? itemScores[idx] : 1;
                        
                        qMaxScore += iScore;
                        studentMatches.push(`فقرة ${idx+1}: (${sVal})`);
                        correctMatches.push(`فقرة ${idx+1}: (${keyVal})`);
                        
                        if (sVal === keyVal) pts += iScore;
                    });

                    studentAns = studentMatches.join(', ');
                    correctKey = correctMatches.join(', ');
                } else {
                    qMaxScore = parseFloat(c.querySelector('.score-input-q')?.value) || 1;
                    const selWord = c.querySelector('.selected-opt .opt')?.value || "";
                    const key = c.querySelector('.hidden-correct-ans')?.value.trim() || c.querySelector('.ans-val')?.value.trim() || "";
                    studentAns = selWord; 
                    correctKey = key; 
                    if (selWord.trim() === key.trim()) pts = qMaxScore;
                }

                totalExamScore += qMaxScore;
                studentAchievedScore += pts;
                details.push({ q: qTxt, studentAns: studentAns, correctAns: correctKey, gotScore: pts, maxScore: qMaxScore, isCorrect: pts > 0 });
                report.innerHTML += `<tr><td>${i+1}</td><td style="text-align:right">${qTxt}</td><td>${studentAns || '--'}</td><td style="color:var(--success-green); font-weight:bold">${correctKey}</td><td>${pts} / ${qMaxScore}</td></tr>`;
            });

            const examId = new URLSearchParams(window.location.search).get('exam');
            if(examId && authenticatedStudentEmail) {
                await fsDb.collection("alkfaeat_results").add({
                    name: authenticatedStudentName,
                    email: authenticatedStudentEmail,
                    score: studentAchievedScore,
                    total: totalExamScore,
                    model_id: examId,
                    answers: details,
                    time: firebase.firestore.FieldValue.serverTimestamp()
                });

                localStorage.setItem('submitted_' + examId, 'true');
                document.getElementById('student-actions').innerHTML = '<div style="background:#fee2e2; color:#991b1b; padding:15px; border-radius:10px; font-weight:bold; border:1px solid #fecaca; width:100%; text-align:center;">تم اعتماد النتيجة بنجاح. لا يمكنك تعديل الإجابات أو إعادة الاختبار.</div>';
            }

            document.getElementById('report-modal-title').innerText = "تقرير أداء الطالب 🎯";
            document.getElementById('report-table-header').innerHTML = "<th>#</th><th>السؤال</th><th>إجابتك</th><th>الصحيحة</th><th>الدرجة</th>";
            document.getElementById('score-summary').innerText = `النتيجة الإجمالية: ${studentAchievedScore} من ${totalExamScore}`;
            document.getElementById('save-review-btn-container').innerHTML = "";
            document.getElementById('report-modal').style.display = 'block'; 
            document.getElementById('modal-overlay').style.display = 'block';
        }

        function loadFromCloud() {
            rtdb.ref('models').once('value', snapshot => {
                const ms = snapshot.val();
                const listContainer = document.getElementById('cloud-models-list');
                listContainer.innerHTML = "";

                if(!ms) {
                    listContainer.innerHTML = "<p style='text-align:center; padding:20px; color:#64748b;'>لا توجد أي نماذج محفوظة في السحاب حالياً.</p>";
                } else {
                    Object.keys(ms).forEach(name => {
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'cloud-item';
                        itemDiv.innerHTML = `
                            <div style="font-weight:bold; color:var(--royal-blue); text-align:right; flex:1; min-width:120px;">${name}</div>
                            <div style="display:flex; gap:6px;">
                                <button class="btn btn-save" style="padding:6px 12px;" onclick="openModel('${name}')"><i class="fas fa-folder-open"></i> فتح</button>
                                <button class="btn btn-del" style="padding:6px 12px;" onclick="deleteSpecificModel('${name}')"><i class="fas fa-trash"></i> حذف</button>
                            </div>
                        `;
                        listContainer.appendChild(itemDiv);
                    });
                }
                document.getElementById('cloud-modal').style.display = 'block';
                document.getElementById('modal-overlay').style.display = 'block';
            });
        }

        async function deleteSpecificModel(modelName) {
            if (confirm(`هل أنت متأكد من حذف النموذج "${modelName}" نهائياً من السحاب؟`)) {
                await rtdb.ref('models/' + modelName).remove();
                alert(`تم حذف النموذج "${modelName}" بنجاح.`);
                if (currentOpenModelName === modelName) {
                    currentOpenModelName = null;
                    document.getElementById('current-model-label').innerText = "📁 نموذج جديد";
                }
                loadFromCloud();
            }
        }

        async function openModel(name) {
            const snap = await rtdb.ref('models/' + name).once('value');
            if (snap.val() && snap.val().data) {
                currentOpenModelName = name;
                document.getElementById('current-model-label').innerText = `📁 ${name}`;
                localStorage.setItem('fifi_final_v_secured', JSON.stringify(snap.val().data));
                
                document.getElementById('quiz-content').innerHTML = "";
                snap.val().data.forEach(q => addQuestion(q));
                
                closeModals();
            }
        }

        function copyCurrentModelLink() {
            if (!currentOpenModelName) {
                alert("الرجاء حفظ النموذج أو فتحه من السحاب أولاً لتوليد رابط المشاركة!");
                return;
            }
            const shareUrl = window.location.origin + window.location.pathname + "?exam=" + encodeURIComponent(currentOpenModelName);
            navigator.clipboard.writeText(shareUrl).then(() => {
                alert(`تم نسخ رابط الاختبار للنموذج "${currentOpenModelName}" بنجاح! 🔗`);
            }).catch(err => {
                prompt("نسخ الرابط يدوياً:", shareUrl);
            });
        }

        async function renameCurrentModel() {
            if (!currentOpenModelName) {
                alert("هذا نموذج جديد لم يتم حفظه في السحاب بعد!");
                return;
            }
            const newName = prompt(`أدخل الاسم الجديد للنموذج "${currentOpenModelName}":`, currentOpenModelName);
            if (!newName || newName.trim() === "" || newName === currentOpenModelName) return;

            const snap = await rtdb.ref('models/' + currentOpenModelName).once('value');
            if (snap.exists()) {
                const modelData = snap.val();
                await rtdb.ref('models/' + newName).set(modelData);
                await rtdb.ref('models/' + currentOpenModelName).remove();
                currentOpenModelName = newName;
                document.getElementById('current-model-label').innerText = `📁 ${newName}`;
                alert("تم تغيير اسم النموذج بنجاح!");
            }
        }

        async function deleteCurrentModel() {
            if (!currentOpenModelName) {
                alert("النموذج غير محفوظ في السحاب أصلاً!");
                return;
            }
            if (confirm(`هل أنت متأكد من حذف النموذج "${currentOpenModelName}" نهائياً من السحاب؟`)) {
                await rtdb.ref('models/' + currentOpenModelName).remove();
                alert("تم حذف النموذج بنجاح.");
                currentOpenModelName = null;
                document.getElementById('current-model-label').innerText = "📁 نموذج جديد";
                clearAll();
            }
        }

        async function saveToCloud() {
            let modelNameToSave = currentOpenModelName;

            if (!modelNameToSave) {
                modelNameToSave = prompt("أدخل اسم النموذج لحفظه في السحاب:");
                if (!modelNameToSave || !modelNameToSave.trim()) return;
                currentOpenModelName = modelNameToSave.trim();
                document.getElementById('current-model-label').innerText = `📁 ${currentOpenModelName}`;
            }

            const dataToSave = JSON.parse(localStorage.getItem('fifi_final_v_secured') || '[]');
            
            await rtdb.ref('models/' + currentOpenModelName).set({
                teacher: "أ. عبدالعزيز الفيفي",
                data: dataToSave,
                date: new Date().toLocaleString()
            });

            alert(`تم حفظ التعديلات بنجاح في نموذج: "${currentOpenModelName}" 💾`);
        }

        function closeModals() { 
            document.getElementById('report-modal').style.display = 'none'; 
            document.getElementById('cloud-modal').style.display = 'none'; 
            document.getElementById('history-modal').style.display = 'none';
            document.getElementById('modal-overlay').style.display = 'none'; 
        }

        function toggleType(s) { 
            const c = s.closest('.question-card'); 
            const val = s.value; 
            c.querySelector('.q-area').innerHTML = (val === 'k_extract') 
                ? `<div class="estieab-box" contenteditable="true" oninput="saveAll()">أدخل نص النص هنا...</div><textarea class="q-text-input q-main" placeholder="اكتب السؤال هنا..."></textarea>`
                : `<textarea class="q-text-input q-main" placeholder="اكتب السؤال هنا..."></textarea>`; 
            c.querySelector('.ans-grid-area').innerHTML = renderOptions(val, null, false); 
            c.querySelector('.correct-ans-box').style.display = (['k_true','k_multi','k_custom_opts'].includes(val)) ? '' : 'none'; 
            c.querySelector('.score-setting-box').style.display = (['k_matching','k_custom_opts'].includes(val)) ? 'none' : 'inline-flex';
            saveAll(); 
        }

        function updateNumbers() { document.querySelectorAll('.q-number-badge').forEach((b, i) => b.innerText = `السؤال ${i+1}`); }

        function saveAll() { 
            const qs = []; 
            document.querySelectorAll('.question-card').forEach(c => { 
                const t = c.querySelector('.type-select').value; 
                let d = { 
                    type: t, 
                    score: parseFloat(c.querySelector('.score-input-q')?.value) || 1,
                    ans: c.querySelector('.ans-val')?.value || '' 
                }; 
                d.text = c.querySelector('.q-main')?.value || ""; 
                if(t==='k_extract') d.text_area = c.querySelector('.estieab-box')?.innerText || ""; 

                if (t === 'k_matching') {
                    d.matchA = Array.from(c.querySelectorAll('.match-a-text')).map(i => i.value);
                    d.matchB = Array.from(c.querySelectorAll('.match-b-text')).map(i => i.value);
                    d.matchAns = Array.from(c.querySelectorAll('.match-ans-key')).map(i => i.value);
                    d.matchScores = Array.from(c.querySelectorAll('.match-item-score')).map(i => parseFloat(i.value) || 1);
                } else if (t === 'k_custom_opts') {
                    d.opts = Array.from(c.querySelectorAll('.opt')).map(i => i.value);
                    d.optScores = Array.from(c.querySelectorAll('.opt-score-val')).map(i => parseFloat(i.value) || 1);
                } else {
                    d.opts = Array.from(c.querySelectorAll('.opt')).map(i => i.value); 
                }

                qs.push(d); 
            }); 
            localStorage.setItem('fifi_final_v_secured', JSON.stringify(qs)); 
        }

        function loadQuestions() { 
            const id = new URLSearchParams(window.location.search).get('exam'); 
            if (id) { 
                document.body.classList.add('student-mode'); 
                document.getElementById('student-auth-container').style.display = 'block';

                rtdb.ref('models/' + id).once('value', s => { 
                    if (s.val() && s.val().data) {
                        loadedExamQuestions = s.val().data;
                        let shuffledQuestions = shuffleArray([...loadedExamQuestions]);
                        shuffledQuestions.forEach(q => addQuestion(q));
                        setTimeout(() => { document.querySelectorAll('textarea').forEach(ta => autoResizeTextarea(ta)); }, 100);
                    } else {
                        alert("هذا النموذج غير موجود أو تم حذفه من السحاب.");
                    }
                }); 
            } else { 
                document.querySelector('.container').style.display = 'block';
                const s = localStorage.getItem('fifi_final_v_secured'); 
                if(s) { 
                    JSON.parse(s).forEach(q => addQuestion(q)); 
                    setTimeout(() => { document.querySelectorAll('textarea').forEach(ta => autoResizeTextarea(ta)); }, 100);
                } else {
                    addQuestion();
                }
            } 
        }

        function clearAll() {
            if(confirm("هل أنت متأكد من مسح جميع الأسئلة؟")) {
                document.getElementById('quiz-content').innerHTML = '';
                localStorage.removeItem('fifi_final_v_secured');
                currentOpenModelName = null;
                document.getElementById('current-model-label').innerText = "📁 نموذج جديد";
            }
        }

        window.onload = function() { loadQuestions(); };
    </script>
</body>
</html>
